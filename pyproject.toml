[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clarautils"
version = "0.1.0"
description = "Claras Python utilities: BitFlagArray/Bitty, typed tables, bit selection"
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["clarautils"]

[tool.setuptools.package-data]
clarautils = ["*.md"]
